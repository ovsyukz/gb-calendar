name: CI

on:
  pull_request:
  push:
    branches: [main, refactoring]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same suite the pre-push hook runs, so CI cannot disagree with a
      # developer's machine about whether the code is fit to push.
      - name: Verify
        run: npm run verify
