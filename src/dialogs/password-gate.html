<!-- No close button and never dismissable: an admin handed a temporary
         password cannot reach anything until they replace it. -->
<dialog id="password-dialog" class="modal">
  <h2 class="modal-title">Choose a password</h2>
  <p class="panel-note">
    You signed in with a temporary password. Pick your own to continue — you cannot use
    the site until you do.
  </p>
  <form id="password-form">
    <div class="field">
      <label for="new-password">New password</label>
      <input
        id="new-password"
        name="password"
        type="password"
        autocomplete="new-password"
        placeholder="at least 12 characters"
      />
    </div>
    <div class="field">
      <label for="confirm-password">Confirm password</label>
      <input
        id="confirm-password"
        name="confirm"
        type="password"
        autocomplete="new-password"
        placeholder="type it again"
      />
    </div>
    <p class="form-message error" id="password-error" role="alert" hidden></p>
    <button type="submit" class="btn-primary">Save password</button>
  </form>
</dialog>
