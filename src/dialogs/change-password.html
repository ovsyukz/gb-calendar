<!-- The voluntary password change, for an admin who is already signed in.
         Dismissable, unlike the forced gate in password-gate.html. Field ids
         must not collide with that dialog's — both are in the page at once. -->
<dialog id="change-password-dialog" class="modal">
  <form method="dialog" class="modal-close-row">
    <button class="link-button" value="close" aria-label="Close">✕</button>
  </form>
  <h2 class="modal-title">Change your password</h2>
  <p class="panel-note" id="change-password-intro">
    Enter the password you use now, then the one you want instead.
  </p>
  <form id="change-password-form">
    <div class="field">
      <label for="current-password">Current password</label>
      <div class="password-input">
        <input
          id="current-password"
          name="currentPassword"
          type="password"
          autocomplete="current-password"
          placeholder="the one you signed in with"
        />
        <button
          type="button"
          class="password-toggle"
          aria-controls="current-password"
          aria-pressed="false"
        >
          Show
        </button>
      </div>
    </div>
    <div class="field">
      <label for="change-new-password">New password</label>
      <div class="password-input">
        <input
          id="change-new-password"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="at least 12 characters"
        />
        <button
          type="button"
          class="password-toggle"
          aria-controls="change-new-password"
          aria-pressed="false"
        >
          Show
        </button>
      </div>
    </div>
    <div class="field">
      <label for="change-confirm-password">Confirm new password</label>
      <div class="password-input">
        <input
          id="change-confirm-password"
          name="confirm"
          type="password"
          autocomplete="new-password"
          placeholder="type it again"
        />
        <button
          type="button"
          class="password-toggle"
          aria-controls="change-confirm-password"
          aria-pressed="false"
        >
          Show
        </button>
      </div>
    </div>
    <button type="submit" class="btn-primary">Change password</button>
  </form>
  <!-- Outside the form on purpose: on success the form is hidden and this is
       what remains, so it cannot live inside the thing it outlives. -->
  <p class="form-message" id="change-password-message" role="status" hidden></p>
</dialog>
